name: Validate Tagalog Academy

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate repository
        run: python scripts/validate_repo.py
      - name: Validate lesson schema
        run: python scripts/validate_schema.py
      - name: Validate GitHub contribution templates
        run: python scripts/validate_github_templates.py
      - name: Run Python tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/theme.js
          node --check assets/js/core.js
          node --check assets/js/app.js
          node --check service-worker.js
      - name: Run JavaScript behavior tests
        run: |
          node tests/test_core.mjs
          node tests/test_service_worker.mjs
      - name: Verify release manifest
        run: python scripts/validate_manifest.py
