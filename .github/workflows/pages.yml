name: Validate and deploy Tagalog Academy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate repository
        run: python scripts/validate_repo.py
      - name: Validate lesson schema
        run: python scripts/validate_schema.py
      - name: Validate GitHub contribution templates
        run: python scripts/validate_github_templates.py
      - name: Run Python tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/theme.js
          node --check assets/js/core.js
          node --check assets/js/app.js
          node --check service-worker.js
      - name: Run JavaScript behavior tests
        run: |
          node tests/test_core.mjs
          node tests/test_service_worker.mjs
      - name: Verify release manifest
        run: python scripts/validate_manifest.py
      - name: Build public site
        run: python scripts/build_site.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: validate
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
